name: Group user pagination validation

on:
  push:
    branches:
      - wso2-is-7.3.0-group-user-pagination

concurrency:
  group: group-user-pagination-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          run_install: false

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Lint changed component
        run: pnpm exec eslint --ext .ts,.tsx --max-warnings=0 --resolve-plugins-relative-to . -- features/admin.groups.v1/components/edit-group/add-group-user-modal.tsx

      - name: Build workspace
        run: pnpm build
